<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOODLE - Multiplayer Drawing Game</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden font-sans">
    <div id="root" class="h-full"></div>

    <!-- Dependencies -->
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <!-- Split React View Components -->
    <script type="text/babel" src="js/components/SharedViews.jsx"></script>
    <script type="text/babel" src="js/components/ShopView.jsx"></script>
    <script type="text/babel" src="js/components/ProfileView.jsx"></script>
    <script type="text/babel" src="js/components/InventoryView.jsx"></script>
    <script type="text/babel" src="js/components/TasksView.jsx"></script>
    <script type="text/babel" src="js/components/LeaderboardView.jsx"></script>
    <script type="text/babel" src="js/components/LobbyView.jsx"></script>
    
    <!-- Game Core Components -->
    <script type="text/babel" src="js/components/GameComponents.jsx"></script>
    <script type="text/babel" src="js/components/ModalManager.jsx"></script>

    <!-- Main App -->
    <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
